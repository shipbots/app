<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ShipBots Customer Service</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- Header is a link: clicking anywhere (logo + title) opens the
       Customer Service dashboard in a new tab. Popup script rewrites
       the href to the configured base URL so this works whether the
       user is on prod or a preview deploy. -->
  <header class="header">
    <button id="header-home" class="header-link" type="button" title="Open the ShipBots Customer Service dashboard">
      <img src="icons/icon-48.png" alt="ShipBots" width="28" height="28" />
      <div>
        <p class="title">ShipBots</p>
        <p class="subtitle">Customer Service</p>
      </div>
    </button>
  </header>

  <!-- Detail view: shown when the user picks a client from search. Holds
       its own header (back button + Open in dashboard) and renders every
       saved field as a collapsible section. -->
  <section id="client-detail" class="client-detail" tabindex="-1" hidden>
    <div class="detail-header">
      <button id="detail-back" class="detail-back" type="button" aria-label="Back to search">←</button>
      <div class="detail-title">
        <p id="detail-name" class="detail-name"></p>
        <p id="detail-meta" class="detail-meta"></p>
      </div>
      <button id="detail-open" class="detail-open" type="button" title="Open in the full dashboard">
        Edit ↗
      </button>
    </div>
    <div id="detail-status" class="detail-status" hidden></div>
    <div class="detail-body">
      <div id="detail-sections" class="detail-sections"></div>
      <aside class="detail-notes" aria-label="Client sticky notes">
        <div class="detail-notes-header">
          <span class="detail-notes-title">Sticky Notes</span>
          <div class="detail-notes-header-right">
            <span id="detail-notes-status" class="detail-notes-status"></span>
            <button id="detail-notes-add" class="detail-notes-add" type="button" title="Add a sticky note">+ Add</button>
          </div>
        </div>
        <div id="detail-notes-composer" class="detail-notes-composer" hidden>
          <textarea id="detail-notes-input" class="detail-notes-input" rows="3" placeholder="Write a note for the team…"></textarea>
          <div class="detail-notes-composer-actions">
            <button id="detail-notes-cancel" class="detail-notes-cancel" type="button">Cancel</button>
            <button id="detail-notes-save" class="detail-notes-save" type="button">Add note</button>
          </div>
        </div>
        <div id="detail-notes-list" class="detail-notes-list"></div>
        <!-- Related projects for this client (active only). Read-only list;
             "+ New" deep-links into the dashboard's Projects view with the
             client pre-filled so the rep can fill in the rest there. -->
        <div class="detail-projects" aria-label="Client projects">
          <div class="detail-projects-header">
            <span class="detail-projects-title">Projects</span>
            <div class="detail-projects-header-right">
              <span class="detail-projects-badge">Preview</span>
              <button id="detail-projects-add" class="detail-projects-add" type="button" title="Create a new project for this client">+ New</button>
            </div>
          </div>
          <div id="detail-projects-list" class="detail-projects-list"></div>
        </div>
      </aside>
    </div>
  </section>

  <!-- Projects view: opened from the "Projects" quick-launch button. Lists
       every ACTIVE project across all clients with its status, client, and
       responsible person. "View more details" deep-links into the dashboard's
       Projects view with that project open (comments, subtasks, etc.). -->
  <section id="projects-view" class="projects-view" tabindex="-1" hidden>
    <div class="detail-header">
      <button id="projects-back" class="detail-back" type="button" aria-label="Back to search">←</button>
      <div class="detail-title">
        <p class="detail-name">Active Projects</p>
        <p id="projects-view-meta" class="detail-meta"></p>
      </div>
      <button id="projects-new" class="pv-new-btn" type="button" title="Create a new project">+ New</button>
    </div>
    <div id="projects-view-status" class="detail-status" hidden></div>
    <div id="projects-view-list" class="projects-view-list"></div>
  </section>

  <!-- Tasks view: opened from the "Tasks" quick-launch button. Lists the
       Monday subtasks assigned to the signed-in user, defaulting to the
       outstanding ones with an Outstanding/Done toggle. "Done ✓" flips a
       task's status to Done in place. -->
  <section id="tasks-view" class="projects-view" tabindex="-1" hidden>
    <div class="detail-header">
      <button id="tasks-back" class="detail-back" type="button" aria-label="Back to search">←</button>
      <div class="detail-title">
        <p class="detail-name">My Tasks</p>
        <p id="tasks-view-meta" class="detail-meta"></p>
      </div>
      <span id="tasks-updating" class="view-updating" hidden>Updating…</span>
      <div class="tv-toggle" role="tablist" aria-label="Filter tasks">
        <button id="tasks-tab-open" class="tv-toggle-btn is-active" type="button" role="tab">Outstanding</button>
        <button id="tasks-tab-done" class="tv-toggle-btn" type="button" role="tab">Done</button>
      </div>
    </div>
    <div id="tasks-view-status" class="detail-status" hidden></div>
    <div id="tasks-view-list" class="projects-view-list"></div>
  </section>

  <!-- Calendar view: opened from the "Calendar" quick-launch button. A month
       grid (like the CS app) of onboarding calls + estimated / actual
       deliveries. Event chips open the client. Data is cached + revalidated. -->
  <section id="calendar-view" class="projects-view calendar-view" tabindex="-1" hidden>
    <div class="detail-header">
      <button id="calendar-back" class="detail-back" type="button" aria-label="Back to search">←</button>
      <div class="detail-title">
        <p class="detail-name">Calendar</p>
        <p id="calendar-view-meta" class="detail-meta"></p>
      </div>
      <span id="calendar-updating" class="view-updating" hidden>Updating…</span>
    </div>
    <div id="calendar-view-status" class="detail-status" hidden></div>
    <div class="cal-nav">
      <button id="cal-today" class="cal-today-btn" type="button">Today</button>
      <button id="cal-prev" class="cal-arrow" type="button" aria-label="Previous month">‹</button>
      <button id="cal-next" class="cal-arrow" type="button" aria-label="Next month">›</button>
      <span id="cal-label" class="cal-label"></span>
      <span class="cal-legend">
        <span class="cal-legend-item"><i class="cal-dot kickoff"></i>Call</span>
        <span class="cal-legend-item"><i class="cal-dot delivery"></i>Delivery</span>
        <span class="cal-legend-item"><i class="cal-dot delivered"></i>Delivered</span>
      </span>
    </div>
    <div id="calendar-grid" class="cal-grid-wrap"></div>
  </section>

  <main id="search-view" class="body">
    <p class="hint">Search a client to open their full info panel:</p>
    <form id="search-form" class="search-form">
      <input
        id="search-input"
        type="search"
        placeholder="iMusti, Alvara, Terra…"
        autocomplete="off"
        autofocus
      />
      <button type="submit" aria-label="Search">→</button>
    </form>

    <div id="search-status" class="search-status" hidden></div>
    <ul id="search-results" class="search-results" role="listbox" hidden></ul>

    <div class="actions">
      <button id="open-calendar" class="action-btn">
        <span class="action-icon" aria-hidden="true">📅</span>
        <span>
          <span class="action-label">Calendar</span>
          <span class="action-desc">Upcoming kickoffs &amp; deliveries</span>
        </span>
      </button>
      <button id="open-tasks" class="action-btn">
        <span class="action-icon" aria-hidden="true">✅</span>
        <span>
          <span class="action-label">Tasks</span>
          <span class="action-desc">Open work across all clients</span>
        </span>
      </button>
      <button id="open-projects" class="action-btn">
        <span class="action-icon" aria-hidden="true">🗂️</span>
        <span>
          <span class="action-label">Projects</span>
          <span class="action-desc">Active projects across all clients</span>
        </span>
      </button>
    </div>

    <div class="section-label">
      <span>Mini Apps</span>
      <button type="button" id="open-all-apps" class="section-link">Open in dashboard →</button>
    </div>
    <div class="mini-apps-grid">
      <button class="tile" data-app="csv-order-formatter" title="Reshape any CSV/Excel into the ShipHero order upload template. Opens in the dashboard.">
        <span class="tile-icon" aria-hidden="true">📊</span>
        <span class="tile-label">CSV Order<br/>Formatter</span>
      </button>
      <button class="tile" data-app="sheet" title="Opens the ShipBots Sheet workspace.">
        <span class="tile-icon" aria-hidden="true">📗</span>
        <span class="tile-label">SHEET</span>
      </button>
      <button class="tile" data-app="ship-hero" title="Opens the ShipHero login.">
        <span class="tile-icon" aria-hidden="true">🚢</span>
        <span class="tile-label">Ship Hero</span>
      </button>
      <button class="tile" data-app="sh-portal" title="Opens the ShipBots 3PL portal.">
        <span class="tile-icon" aria-hidden="true">📦</span>
        <span class="tile-label">SH Portal</span>
      </button>
      <button class="tile" data-app="help-shiphero" title="How-to articles for AppDot clients.">
        <span class="tile-icon" aria-hidden="true">🆘</span>
        <span class="tile-label">Help<br/>Shiphero</span>
      </button>
      <button class="tile" data-app="help-portal" title="How-to articles for Portal clients.">
        <span class="tile-icon" aria-hidden="true">📖</span>
        <span class="tile-label">Help Portal</span>
      </button>
      <button class="tile" data-app="returns-dashboard" title="Opens the ShipBots Returns Dashboard.">
        <span class="tile-icon" aria-hidden="true">↩️</span>
        <span class="tile-label">Returns<br/>Dashboard</span>
      </button>
      <button class="tile" data-app="bol-uploader" title="Upload a Bill of Lading — Claude reads it and files it to the client.">
        <span class="tile-icon" aria-hidden="true">🚛</span>
        <span class="tile-label">BOL<br/>Uploader</span>
      </button>
      <button class="tile" data-app="photo-to-po" title="Snap a photo of an invoice — Claude drafts a ShipHero PO. In development.">
        <span class="tile-icon" aria-hidden="true">📸</span>
        <span class="tile-label">Photo to PO</span>
      </button>
    </div>

  </main>

  <!-- Create-project composer. Opened from the client detail's "+ New" and the
       Projects view header; POSTs straight to /api/projects so a rep never
       leaves the popup. Hidden until openProjectComposer() shows it. -->
  <div id="project-composer" class="pc-overlay" tabindex="-1" hidden>
    <div class="pc-modal" role="dialog" aria-modal="true" aria-labelledby="pc-title">
      <div class="pc-head">
        <span id="pc-title" class="pc-title">New Project</span>
        <button id="pc-close" class="pc-close" type="button" aria-label="Close">×</button>
      </div>
      <div class="pc-body">
        <label class="pc-label" for="pc-name">Project name</label>
        <input id="pc-name" class="pc-input" type="text" placeholder="e.g. Q3 rate renegotiation" />
        <label class="pc-label" for="pc-client">Client</label>
        <input id="pc-client" class="pc-input" type="text" placeholder="Client name" />
        <label class="pc-label" for="pc-owner">Responsible (email)</label>
        <input id="pc-owner" class="pc-input" type="email" placeholder="you@shipbots.com" />
        <label class="pc-label" for="pc-note">Description</label>
        <textarea id="pc-note" class="pc-input pc-textarea" rows="3" placeholder="What is this project about?"></textarea>
        <div id="pc-status" class="pc-status" hidden></div>
      </div>
      <div class="pc-actions">
        <button id="pc-cancel" class="pc-btn pc-btn-ghost" type="button">Cancel</button>
        <button id="pc-create" class="pc-btn pc-btn-primary" type="button">Create project</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
